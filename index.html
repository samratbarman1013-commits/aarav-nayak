<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aarav Nayak (@aaravnayak13)</title>
<meta name="description" content="Profile page for Aarav Nayak, @aaravnayak13.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0b0f'/><text x='50' y='68' font-size='52' font-family='system-ui' fill='%23fff' text-anchor='middle'>A</text></svg>">
<style>
  :root{
    --bg:#0b0b0f;
    --panel:#131319;
    --panel-2:#191922;
    --line:rgba(255,255,255,.08);
    --text:#f4f4f6;
    --muted:#9a9aa8;
    --accent:#7c5cff;
    --accent-2:#39d0c6;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 520px at 15% -10%, rgba(124,92,255,.20), transparent 60%),
      radial-gradient(700px 460px at 92% 4%, rgba(57,208,198,.14), transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px 40px;
  }
  .wrap{width:100%;max-width:760px}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:26px;
    padding:30px 28px 26px;
    backdrop-filter:blur(8px);
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .avatar{
    width:92px;height:92px;border-radius:50%;
    display:grid;place-items:center;
    font-size:34px;font-weight:600;letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 12px 30px rgba(124,92,255,.28);
    flex:0 0 auto;
  }
  .id{min-width:0}
  .name{margin:0;font-size:26px;font-weight:650;letter-spacing:-.3px}
  .handle{margin:2px 0 0;color:var(--muted);font-size:15px}
  .bio{margin:14px 0 0;font-size:16.5px;color:#e8e8ee}
  .stats{
    display:flex;gap:10px;margin:22px 0 0;flex-wrap:wrap;
  }
  .stat{
    flex:1 1 130px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
    text-align:center;
  }
  .stat b{display:block;font-size:20px;font-weight:650;letter-spacing:-.2px}
  .stat span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .actions{display:flex;gap:10px;margin:22px 0 0;flex-wrap:wrap}
  .btn{
    appearance:none;border:0;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{
    color:#fff;
    background:linear-gradient(135deg,var(--accent),#5f45d6);
    box-shadow:0 10px 26px rgba(124,92,255,.32);
  }
  .btn-primary:hover{box-shadow:0 14px 32px rgba(124,92,255,.42)}
  .btn-ghost{
    color:var(--text);background:var(--panel-2);border:1px solid var(--line);
  }
  .btn-ghost:hover{background:#1f1f29}
  .divider{height:1px;background:var(--line);margin:26px 0}
  .section-title{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;font-weight:600;
  }
  .rows{display:grid;gap:10px}
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;text-decoration:none;color:var(--text);
    transition:background .15s ease,border-color .15s ease;
  }
  .row:hover{background:var(--panel-2);border-color:rgba(255,255,255,.16)}
  .row .l{display:flex;flex-direction:column;min-width:0}
  .row .l b{font-size:15px;font-weight:600}
  .row .l small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .arrow{color:var(--muted);font-size:18px}
  footer{margin:18px 4px 0;color:#6f6f7e;font-size:12.5px;text-align:center}
  @media (max-width:520px){
    .card{padding:24px 20px 22px;border-radius:22px}
    .avatar{width:76px;height:76px;font-size:28px}
    .name{font-size:22px}
    .stat{flex:1 1 90px;padding:11px 10px}
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="card" aria-labelledby="name">

    <div class="top">
      <div class="avatar" aria-hidden="true">AN</div>
      <div class="id">
        <h1 class="name" id="name">Aarav Nayak</h1>
        <p class="handle">@aaravnayak13</p>
      </div>
    </div>

    <p class="bio">the stars need darkness to shine &#11088;&#128155;</p>

    <div class="stats" role="list">
      <div class="stat" role="listitem"><b>0</b><span>Posts</span></div>
      <!-- Followers: change the number below to update the page -->
      <div class="stat" role="listitem"><b>138</b><span>Followers</span></div>
      <div class="stat" role="listitem"><b>360</b><span>Following</span></div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="https://www.instagram.com/aaravnayak13/" target="_blank" rel="noopener">Follow on Instagram</a>
      <a class="btn btn-ghost" href="https://ig.me/m/aaravnayak13" target="_blank" rel="noopener">Message</a>
    </div>

    <div class="divider"></div>

    <h2 class="section-title">Links</h2>
    <div class="rows">
      <a class="row" href="https://www.instagram.com/aaravnayak13/" target="_blank" rel="noopener">
        <span class="l"><b>Instagram</b><small>instagram.com/aaravnayak13</small></span>
        <span class="arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="row" href="https://ig.me/m/aaravnayak13" target="_blank" rel="noopener">
        <span class="l"><b>Direct message</b><small>Send a message on Instagram</small></span>
        <span class="arrow" aria-hidden="true">&#8599;</span>
      </a>
    </div>

  </section>
  <footer>&copy; 2026 Aarav Nayak &middot; @aaravnayak13</footer>
</main>
</body>
</html>
